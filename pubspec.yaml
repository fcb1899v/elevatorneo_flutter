name: letselevatorneo
description: elevatorsimulatorneo
publish_to: 'none'
version: 1.5.26+74

environment:
  # 3.47 is the floor, not 3.3: Android Gradle Plugin 9 rejects the Kotlin
  # Gradle Plugin being applied on top, and Flutter forces it onto plugin
  # modules until 3.47 adds the isBuiltInKotlinEnabled guard. Declaring 3.3
  # let `pub get` succeed and the Android build fail later with an error
  # that names neither.
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  webview_flutter_android: ^4.14.0
  webview_flutter: ^4.14.1
  # Firebase Analytics
  firebase_core: ^4.13.0
  firebase_core_web: ^3.10.0
  firebase_analytics: ^12.4.6
  firebase_analytics_web: ^0.6.1+12
  # App Icon
  cupertino_icons: ^1.0.9
  flutter_launcher_icons: ^0.14.4
  # Text to Speech
  # Fork of pub.dev flutter_tts 4.2.5. Upstream has no Swift Package Manager
  # support and its last commit was 2026-01-05, so waiting for it would keep
  # CocoaPods in the iOS build. Changes from the published 4.2.5:
  #   ios/flutter_tts/, macos/flutter_tts/   SPM manifests, added
  #   android/build.gradle                   branch on android.builtInKotlin so
  #                                          AGP 9 compiles the Kotlin itself
  #   example/, gen/, test/                  removed; not needed to build
  # The Dart sources are unchanged. `diff -rq` against the pub-cache copy shows
  # exactly the five entries above.
  flutter_tts:
    path: packages/flutter_tts
  # Audio Player
  just_audio: ^0.10.6
  # Vibration
  vibration: ^3.2.0
  # SharedPreference
  shared_preferences: ^2.5.5
  shared_preferences_web: ^2.4.3
  # Game Center
  games_services: ^5.3.0
  connectivity_plus: ^7.3.1
  # Admob
  google_mobile_ads: ^9.1.0
  # In-App Purchase (RevenueCat)
  purchases_flutter: ^10.10.0
  # Store Review
  in_app_review: ^2.0.10
  #env
  flutter_dotenv: ^6.0.1
  # HyperLink
  path: ^1.9.1
  url_launcher: ^6.3.2
  url_launcher_web: ^2.4.3
  #MVVM
  hooks_riverpod: ^3.4.2
  flutter_hooks: ^0.21.3+1
  # Image
  image_picker: ^1.2.3
  image_cropper: ^12.2.1
  path_provider: ^2.1.6
  # Permission
  permission_handler: ^13.0.0
  # App Splash
  flutter_native_splash: ^2.4.8

  # Localize
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_native_splash:
  image: "assets/icon/icon.png"
  color: "#F7B249"
  android_12:
    image: "assets/icon/icon_splash.png"
    icon_background_color: "#F7B249"
  ios: true

flutter:
  config:
    enable-swift-package-manager: true
  generate: true
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/audios/
    - assets/images/
    - assets/images/button/
    - assets/images/elevator/
    - assets/images/room/
    - assets/images/menu/
    - assets/images/settings/
    - assets/.env
  fonts:
    #For title font
    - family: cornerstone
      fonts:
        - asset: assets/fonts/cornerstone.ttf
    #For English, Spanish, French font
    - family: roboto
      fonts:
        - asset: assets/fonts/Roboto-Bold.ttf
    #For Japanese font
    - family: notoJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Bold.ttf
    #For Chinese font
    - family: notoSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Bold.ttf
    #For Korean font
    - family: bmDohyeon
      fonts:
        - asset: assets/fonts/bm-dohyeon.regular.ttf
    #For dot number
    - family: lcd
      fonts:
        - asset: assets/fonts/5x8_lcd_hd44780u_a02.ttf
    #For digital number
    - family: dseg
      fonts:
        - asset: assets/fonts/DSEG7Classic-BoldItalic.ttf
    #For digital alphabet
    - family: letsgo
      fonts:
        - asset: assets/fonts/letsgodigital.ttf